name: kgl_time
description: "Arbeitszeiterfassung für die Kirchgemeinde Lauterbrunnen"
publish_to: 'none'

version: 0.3.1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.5+1
  notifying_list: ^0.1.0
  go_router: ^18.1.1
  intl: any
  week_number: ^1.1.1
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.6
  path_provider_linux: ^2.2.2
  url_launcher: ^6.3.3
  animated_toggle_switch: ^0.8.7
  timer_builder: ^2.0.0
  collection: any
  http: ^1.6.0
  animated_list_plus: ^0.5.2
  share_plus: ^13.3.1
  csv: ^8.0.0
  flutter_file_dialog: ^3.3.3
  json_annotation: ^4.12.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.4.1
  build_runner: ^2.16.2 #further upgrade blocked by isar_community_generator 3.4.1
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
  - assets/playstore-icon.png
  generate: true
flutter_intl:
  enabled: true
